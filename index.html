<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AFK Item Collector</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Login Screen -->
    <section class="login-screen" id="loginScreen">
      <div class="login-card">
        <h1>AFK Item Collector</h1>
        <input
          type="text"
          id="playerNameInput"
          placeholder="Masukkan nama kamu..."
        />
        <button id="btnSetName" class="btn btn-primary">Mulai Bermain</button>
        <p class="version-text">Versi 1.2.2</p>
      </div>
    </section>

    <!-- Game UI -->
    <main id="gameUI" class="hidden">
      <header class="game-header">
        <h2 id="playerTitle">
          Selamat datang, <span id="playerNameDisplay"></span>
        </h2>
        <button id="btnLogout" class="btn btn-danger small">Keluar</button>
      </header>

      <!-- Stats -->
      <section class="stats">
        <div class="stat-box">
          <p>Crystals</p>
          <h3 id="crystals">0</h3>
        </div>
        <div class="stat-box">
          <p>Level</p>
          <h3 id="collectorLevel">1</h3>
        </div>
        <div class="stat-box">
          <p>Upgrade</p>
          <h3 id="upgradeCost">10</h3>
        </div>
        <div class="stat-box wide" id="boosterStatus">Booster: Tidak Aktif</div>
      </section>

      <!-- Controls -->
      <section class="controls">
        <button id="btnStartPause" class="btn btn-success">Mulai Kumpul</button>
        <button id="btnUpgrade" class="btn btn-primary">Upgrade</button>
        <button id="btnToggleAutoUpgrade" class="btn btn-secondary">
          Auto Upgrade OFF
        </button>
        <button id="btnBuyBooster" class="btn btn-warning">
          Booster (50 Crystals)
        </button>
      </section>

      <!-- Equipped Item -->
      <section class="equipped">
        <h3>Item Terpasang</h3>
        <div class="equipped-display" id="equippedItemDisplay">
          <img src="" alt="" id="skinImage" />
          <p id="skinName">Belum ada item</p>
        </div>
      </section>

      <!-- Bag -->
      <section class="bag-section">
        <h3>Tas Koleksi</h3>
        <div class="bag-items" id="bagItems"></div>
      </section>

      <!-- Regular Shop -->
      <section class="shop-section">
        <h3>Toko Regular</h3>
        <div class="shop-items" id="regularItemsList"></div>
      </section>

      <!-- Limited Shop -->
      <section class="shop-section">
        <h3>Toko Terbatas</h3>
        <div class="shop-items" id="limitedItemsList"></div>
      </section>

      <!-- Transfer -->
      <section class="transfer-section">
        <h3>Transfer Item</h3>
        <div class="transfer-controls">
          <select id="transferItemSelect"></select>
          <input
            type="text"
            id="transferToPlayerInput"
            placeholder="Nama pemain tujuan..."
          />
          <button id="btnTransfer" class="btn btn-dark">Transfer</button>
        </div>
      </section>

      <!-- Leaderboard -->
      <section class="leaderboard-section">
        <h3>Leaderboard</h3>
        <ul id="leaderboardList" class="leaderboard-list"></ul>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
